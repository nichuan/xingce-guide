# 构建静态站点并按 GitHub Pages 的约定发布。
#
# 触发：推送到 main、手动触发；PR 只跑构建与自检，不发布。
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: |
          python3 scripts/build_site.py \
            --input src/guide.md \
            --output dist \
            --title "行测六大模块" \
            --subtitle "考点 / 技巧 / 例题" \
            --logo "行测" \
            --quiz-re '^\*\*示例\s*(\d+)\*\*(.*)$' \
            --download "xingce-guide.docx" \
            --download-label "下载 Word 版"

      - name: Copy downloadable Word version
        run: cp src/guide.docx dist/xingce-guide.docx

      - name: Check built site
        run: python3 scripts/check_site.py dist/index.html

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
